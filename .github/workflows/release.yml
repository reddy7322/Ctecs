name: "CTECS Release System"
run-name: "CTECS ${{ inputs.release_channel || 'Release' }} Build (${{ github.ref_name }})"

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release Channel'
        required: true
        type: choice
        options:
          - 'beta'
          - 'stable'
        default: 'beta'
      version_name:
        description: 'Version Name (e.g. 1.0.0). Leave blank to auto-detect/increment.'
        required: false
        default: ''
      release_notes:
        description: 'Custom Release Notes (Optional)'
        required: false
        default: ''

permissions:

  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Selected Revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Validate Release Channel & Compute Version
        id: versioning
        run: |
          echo "=========================================================="
          echo "        CTECS RELEASE CHANNEL & VERSION CALCULATION       "
          echo "=========================================================="
          
          git fetch --unshallow 2>/dev/null || git fetch --tags 2>/dev/null || true
          
          # 1. Determine Release Channel
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ github.event.inputs.release_channel }}"
          elif [[ "${{ github.ref }}" =~ refs/tags/v.*(-beta|-alpha|-rc) ]]; then
            CHANNEL="beta"
          else
            CHANNEL="stable"
          fi
          
          if [ "$CHANNEL" != "beta" ] && [ "$CHANNEL" != "stable" ]; then
            echo "::error::Invalid release_channel '$CHANNEL'. Must be exactly 'beta' or 'stable'."
            exit 1
          fi
          echo "Target Release Channel: $CHANNEL"
          
          # 2. Determine Base Semantic Version (MAJOR.MINOR.PATCH)
          INPUT_VERSION="${{ github.event.inputs.version_name }}"
          INPUT_VERSION="${INPUT_VERSION#v}"
          INPUT_VERSION="${INPUT_VERSION#"${INPUT_VERSION%%[![:space:]]*}"}"
          INPUT_VERSION="${INPUT_VERSION%"${INPUT_VERSION##*[![:space:]]}"}"
          
          if [ -n "$INPUT_VERSION" ]; then
            CLEAN_BASE=$(echo "$INPUT_VERSION" | sed -E 's/-.*//')
            if [[ ! "$CLEAN_BASE" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
              echo "::error::Invalid manual version format '$INPUT_VERSION'. Must be semantic format like 1.0.0 or 1.1."
              exit 1
            fi
            IFS='.' read -r M1 M2 M3 <<< "$CLEAN_BASE"
            BASE_VERSION="${M1:-1}.${M2:-0}.${M3:-0}"
            echo "Using developer specified base version: $BASE_VERSION"
          elif [[ "${{ github.ref }}" =~ refs/tags/v ]]; then
            TAG_RAW="${{ github.ref_name }}"
            TAG_RAW="${TAG_RAW#v}"
            CLEAN_BASE=$(echo "$TAG_RAW" | sed -E 's/-.*//')
            IFS='.' read -r M1 M2 M3 <<< "$CLEAN_BASE"
            BASE_VERSION="${M1:-1}.${M2:-0}.${M3:-0}"
            echo "Using base version from pushed tag: $BASE_VERSION"
          else
            LATEST_STABLE_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | grep -v "-" | sort -V | tail -n 1 || true)
            if [ -n "$LATEST_STABLE_TAG" ]; then
              TAG_CLEAN="${LATEST_STABLE_TAG#v}"
              IFS='.' read -r M1 M2 M3 <<< "$TAG_CLEAN"
              if [ "$CHANNEL" = "stable" ]; then
                M3=$((M3 + 1))
              fi
              BASE_VERSION="${M1:-1}.${M2:-0}.${M3:-0}"
              echo "Derived base version from git history ($LATEST_STABLE_TAG): $BASE_VERSION"
            else
              GRADLE_VER=$(grep -E 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
              GRADLE_VER="${GRADLE_VER:-1.0.0}"
              IFS='.' read -r M1 M2 M3 <<< "$GRADLE_VER"
              BASE_VERSION="${M1:-1}.${M2:-0}.${M3:-0}"
              echo "Derived base version from app/build.gradle.kts: $BASE_VERSION"
            fi
          fi
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          
          # 3. Channel-Specific Configuration & Tag Collision Safety
          if [ "$CHANNEL" = "stable" ]; then
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            NEW_TAG="v${NEW_VERSION}"
            RELEASE_TITLE="CTECS Stable v${NEW_VERSION}"
            IS_PRERELEASE="false"
            
            if git rev-parse -q --verify "refs/tags/${NEW_TAG}" >/dev/null; then
              echo "::error::Stable release tag '${NEW_TAG}' already exists! Cannot overwrite an existing stable release."
              exit 1
            fi
            
            VERSION_CODE=$(( MAJOR * 100000 + MINOR * 10000 + PATCH * 100 + 99 ))
          else
            LATEST_BETA_NUM=$(git tag -l "v${BASE_VERSION}-beta.*" | sed -E 's/.*-beta\.([0-9]+)/\1/' | sort -n | tail -n 1 || true)
            if [ -n "$LATEST_BETA_NUM" ]; then
              BETA_NUM=$((LATEST_BETA_NUM + 1))
            else
              BETA_NUM=1
            fi
            
            while git rev-parse -q --verify "refs/tags/v${BASE_VERSION}-beta.${BETA_NUM}" >/dev/null; do
              BETA_NUM=$((BETA_NUM + 1))
            done
            
            NEW_VERSION="${BASE_VERSION}-beta.${BETA_NUM}"
            NEW_TAG="v${NEW_VERSION}"
            RELEASE_TITLE="CTECS Beta v${NEW_VERSION}"
            IS_PRERELEASE="true"
            
            VERSION_CODE=$(( MAJOR * 100000 + MINOR * 10000 + PATCH * 100 + (BETA_NUM % 99) ))
          fi
          
          APK_NAME="CTECS-${NEW_VERSION}.apk"
          AAB_NAME="CTECS-${NEW_VERSION}.aab"
          
          echo "----------------------------------------------------------"
          echo "Channel:          $CHANNEL"
          echo "Version Name:     $NEW_VERSION"
          echo "Version Code:     $VERSION_CODE"
          echo "Git Tag:          $NEW_TAG"
          echo "Release Title:    $RELEASE_TITLE"
          echo "Is Pre-release:   $IS_PRERELEASE"
          echo "Target APK Name:  $APK_NAME"
          echo "Target AAB Name:  $AAB_NAME"
          echo "----------------------------------------------------------"
          
          if [ -f "app/build.gradle.kts" ]; then
            sed -i -E "s/versionCode = [0-9]+/versionCode = $VERSION_CODE/g" app/build.gradle.kts
            sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"$NEW_VERSION\"/g" app/build.gradle.kts
            sed -i -E "s/versionCode = if \(updateChannel == \"beta\"\) [0-9]+ else [0-9]+/versionCode = if (updateChannel == \"beta\") $VERSION_CODE else 101699/g" app/build.gradle.kts
            sed -i -E "s/versionName = if \(updateChannel == \"beta\"\) \"[^\"]+\" else \"[^\"]+\"/versionName = if (updateChannel == \"beta\") \"$NEW_VERSION\" else \"1.0.16\"/g" app/build.gradle.kts
            echo "Updated app/build.gradle.kts with synchronized version properties:"
            grep -E "versionCode|versionName" app/build.gradle.kts
          else
            echo "::error::app/build.gradle.kts not found!"
            exit 1
          fi
          
          echo "RELEASE_CHANNEL=$CHANNEL" >> $GITHUB_ENV
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "NEW_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_ENV
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "AAB_NAME=$AAB_NAME" >> $GITHUB_ENV

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 4. Accept Android SDK Licenses
        run: |
          mkdir -p "${ANDROID_HOME:-/usr/local/lib/android/sdk}/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "${ANDROID_HOME:-/usr/local/lib/android/sdk}/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "${ANDROID_HOME:-/usr/local/lib/android/sdk}/licenses/android-sdk-license"
          echo "84831b9409646a233e8a4d45d625514c33f2601a" > "${ANDROID_HOME:-/usr/local/lib/android/sdk}/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: 5. Decode Keystore & Configure Signing
        run: |
          echo "Configuring release signing keystore..."
          if [ -n "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks
            echo "Decoded keystore from secrets.UPLOAD_KEYSTORE_BASE64."
          elif [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks
            echo "Decoded keystore from secrets.KEYSTORE_BASE64."
          elif [ -f "upload.keystore.base64" ]; then
            base64 --decode upload.keystore.base64 > upload-keystore.jks
            echo "Decoded keystore from upload.keystore.base64 file."
          elif [ -f "upload-keystore.jks" ]; then
            echo "Using existing upload-keystore.jks from workspace."
          else
            echo "::error::Required signing keystore is missing! Configure UPLOAD_KEYSTORE_BASE64 in GitHub Secrets."
            exit 1
          fi
          
          cp upload-keystore.jks my-upload-key.jks
          
          if [ ! -s "upload-keystore.jks" ]; then
            echo "::error::Decoded upload-keystore.jks is empty or corrupted!"
            exit 1
          fi
          echo "Signing Keystore confirmed ready at $(pwd)/upload-keystore.jks ($(wc -c < upload-keystore.jks) bytes)"

      - name: 6. Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 7. Run Unit Tests & Build Validation
        run: |
          echo "Running unit test suite..."
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:testDebugUnitTest --no-daemon
          else
            gradle :app:testDebugUnitTest --no-daemon
          fi

      - name: 8. Build Release APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || 'ctecs123456' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || 'ctecs123456' }}
        run: |
          echo "Compiling signed release APK and AAB for channel '${{ env.RELEASE_CHANNEL }}'..."
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleRelease :app:bundleRelease -PupdateChannel=${{ env.RELEASE_CHANNEL }} --no-daemon
          else
            gradle :app:assembleRelease :app:bundleRelease -PupdateChannel=${{ env.RELEASE_CHANNEL }} --no-daemon
          fi

      - name: 9. Verify APK Signature & Package Artifacts
        id: package_artifacts
        run: |
          mkdir -p release_artifacts
          
          RAW_APK=$(find app/build -name "*release*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find app/build -name "*.apk" | head -n 1)
          fi
          
          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "::error::No APK file generated during build!"
            exit 1
          fi
          
          echo "Validating APK signature on: $RAW_APK"
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$RAW_APK" || {
              echo "::error::APK signature verification failed!"
              exit 1
            }
          else
            jarsigner -verify -certs "$RAW_APK" || {
              echo "::error::APK signature verification failed!"
              exit 1
            }
          fi
          echo "APK signature successfully verified."
          
          FINAL_APK="release_artifacts/${{ env.APK_NAME }}"
          cp "$RAW_APK" "$FINAL_APK"
          APK_SIZE_BYTES=$(wc -c < "$FINAL_APK")
          APK_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $APK_SIZE_BYTES/1048576}")
          
          RAW_AAB=$(find app/build -name "*release*.aab" | head -n 1)
          if [ -n "$RAW_AAB" ] && [ -f "$RAW_AAB" ]; then
            FINAL_AAB="release_artifacts/${{ env.AAB_NAME }}"
            cp "$RAW_AAB" "$FINAL_AAB"
            AAB_SIZE_BYTES=$(wc -c < "$FINAL_AAB")
            AAB_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $AAB_SIZE_BYTES/1048576}")
            echo "Packaged AAB: $FINAL_AAB ($AAB_SIZE_MB MB)"
          fi
          
          echo "Packaged APK: $FINAL_APK ($APK_SIZE_MB MB)"
          echo "apk_size=$APK_SIZE_MB MB" >> $GITHUB_OUTPUT
          echo "apk_bytes=$APK_SIZE_BYTES" >> $GITHUB_ENV

      - name: 10. Generate Release Notes & Channel Metadata
        env:
          CUSTOM_NOTES: ${{ github.event.inputs.release_notes }}
          APK_BYTES_VAL: ${{ env.apk_bytes }}
        run: |
          echo "## CTECS Release Summary" > release_notes.md
          echo "" >> release_notes.md
          echo "- **Channel:** \`${{ env.RELEASE_CHANNEL }}\`" >> release_notes.md
          echo "- **Version Name:** \`${{ env.NEW_VERSION }}\`" >> release_notes.md
          echo "- **Version Code:** \`${{ env.NEW_CODE }}\`" >> release_notes.md
          echo "- **Git Tag:** \`${{ env.NEW_TAG }}\`" >> release_notes.md
          echo "- **Pre-release:** \`${{ env.IS_PRERELEASE }}\`" >> release_notes.md
          echo "- **Build Run:** #${{ github.run_number }}" >> release_notes.md
          echo "- **Commit Hash:** \`${{ github.sha }}\`" >> release_notes.md
          echo "" >> release_notes.md
          
          if [ -n "$CUSTOM_NOTES" ]; then
            echo "### Release Notes" >> release_notes.md
            echo "$CUSTOM_NOTES" >> release_notes.md
            echo "" >> release_notes.md
          fi
          
          echo "### Download Artifacts" >> release_notes.md
          echo "- 📱 **Direct APK Download:** [\`${{ env.APK_NAME }}\`](https://github.com/${{ github.repository }}/releases/download/${{ env.NEW_TAG }}/${{ env.APK_NAME }})" >> release_notes.md
          echo "- 📦 **Play Store Bundle:** [\`${{ env.AAB_NAME }}\`](https://github.com/${{ github.repository }}/releases/download/${{ env.NEW_TAG }}/${{ env.AAB_NAME }})" >> release_notes.md
          echo "" >> release_notes.md
          
          echo "### Recent Changes" >> release_notes.md
          git log -n 8 --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" >> release_notes.md || true
          echo "" >> release_notes.md
          
          python3 -c '
          import json, os, time

          channel = os.environ.get("RELEASE_CHANNEL", "stable")
          version = os.environ.get("NEW_VERSION", "1.0.0")
          try:
              code = int(os.environ.get("NEW_CODE", "100099"))
          except ValueError:
              code = 100099
          tag = os.environ.get("NEW_TAG", "v1.0.0")
          repo = os.environ.get("GITHUB_REPOSITORY", "reddy7322/Ctecs")
          apk = os.environ.get("APK_NAME", "CTECS-1.0.0.apk")
          try:
              bytes_val = int(os.environ.get("APK_BYTES_VAL", "0"))
          except ValueError:
              bytes_val = 0
          notes = os.environ.get("CUSTOM_NOTES", "").strip() or "Release update available."

          data = {
            "release_channel": channel,
            "version_name": version,
            "version_code": code,
            "release_tag": tag,
            "apk_download_url": "https://github.com/" + repo + "/releases/download/" + tag + "/" + apk,
            "apk_size_bytes": bytes_val,
            "release_notes": notes,
            "min_supported_version": 1,
            "published_timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          }

          dir1 = "updates/" + channel
          dir2 = channel
          os.makedirs(dir1, exist_ok=True)
          os.makedirs(dir2, exist_ok=True)
          os.makedirs("release_artifacts", exist_ok=True)

          with open(dir1 + "/update.json", "w") as f:
              json.dump(data, f, indent=2)
          with open(dir2 + "/update.json", "w") as f:
              json.dump(data, f, indent=2)
          with open("release_artifacts/update.json", "w") as f:
              json.dump(data, f, indent=2)

          print("Generated update.json for channel " + channel + " successfully.")
          '


      - name: 11. Commit & Push Channel Metadata Feed & Version Properties
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "updates/${{ env.RELEASE_CHANNEL }}/update.json" "${{ env.RELEASE_CHANNEL }}/update.json" app/build.gradle.kts
          if git commit -m "Update ${{ env.RELEASE_CHANNEL }} channel metadata feed & version properties to v${{ env.NEW_VERSION }} (Build ${{ env.NEW_CODE }}) [skip ci]"; then
            git push origin HEAD:main 2>/dev/null || git push origin HEAD:master 2>/dev/null || true
          else
            echo "No changes to commit for metadata feed."
          fi

      - name: 12. Publish GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TITLE }}
          tag_name: ${{ env.NEW_TAG }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          body_path: release_notes.md
          files: |
            release_artifacts/*.apk
            release_artifacts/*.aab
            release_artifacts/update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 13. Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: CTECS-${{ env.NEW_VERSION }}-Binaries
          path: release_artifacts/*
          retention-days: 30

      - name: 14. Display Summary in GitHub Actions
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          # 🚀 CTECS ${{ env.RELEASE_CHANNEL == 'stable' && 'Stable' || 'Beta' }} Release Published

          | Attribute | Value |
          | :--- | :--- |
          | **Release Channel** | \`${{ env.RELEASE_CHANNEL }}\` |
          | **Release Title** | **${{ env.RELEASE_TITLE }}** |
          | **Version Name** | \`${{ env.NEW_VERSION }}\` |
          | **Version Code** | \`${{ env.NEW_CODE }}\` |
          | **Git Tag** | [\`${{ env.NEW_TAG }}\`](https://github.com/${{ github.repository }}/releases/tag/${{ env.NEW_TAG }}) |
          | **Pre-release** | \`${{ env.IS_PRERELEASE }}\` |
          | **Build Run** | \`#${{ github.run_number }}\` |
          | **Commit** | [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |
          | **Release URL** | [https://github.com/${{ github.repository }}/releases/tag/${{ env.NEW_TAG }}](https://github.com/${{ github.repository }}/releases/tag/${{ env.NEW_TAG }}) |

          ### 📦 Published Artifacts
          - 📱 **Signed APK:** [\`${{ env.APK_NAME }}\`](https://github.com/${{ github.repository }}/releases/download/${{ env.NEW_TAG }}/${{ env.APK_NAME }}) (${{ steps.package_artifacts.outputs.apk_size }})
          - 📦 **Play Store AAB:** [\`${{ env.AAB_NAME }}\`](https://github.com/${{ github.repository }}/releases/download/${{ env.NEW_TAG }}/${{ env.AAB_NAME }})
          EOF
