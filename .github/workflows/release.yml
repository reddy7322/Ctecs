name: Release APK & AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Select Release Channel (stable or beta)'
        required: true
        type: choice
        default: 'stable'
        options:
          - 'stable'
          - 'beta'
      version_tag:
        description: 'Release Tag (leave empty for auto-increment, or specify e.g. v1.0.1 or v1.0.1-beta.1)'
        required: false
        default: ''
      release_title:
        description: 'Release Title (optional custom title)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "${ANDROID_HOME:-/usr/local/lib/android/sdk}/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "${ANDROID_HOME:-/usr/local/lib/android/sdk}/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "${ANDROID_HOME:-/usr/local/lib/android/sdk}/licenses/android-sdk-license"
          echo "84831b9409646a233e8a4d45d625514c33f2601a" > "${ANDROID_HOME:-/usr/local/lib/android/sdk}/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Decode Upload Keystore
        run: |
          echo "Decoding release keystore..."
          if [ -n "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks
          elif [ -f "upload.keystore.base64" ]; then
            base64 --decode upload.keystore.base64 > upload-keystore.jks
          elif [ -f "upload-keystore.jks" ]; then
            echo "upload-keystore.jks already present in workspace."
          else
            echo "ERROR: Keystore not found!"
            exit 1
          fi
          # Ensure both expected filenames exist for build configuration compatibility
          cp upload-keystore.jks my-upload-key.jks
          echo "Keystore ready at $(pwd)/upload-keystore.jks"

      - name: Resolve Channel, Auto Increment & Update Version
        run: |
          echo "Fetching git tags and history..."
          git fetch --unshallow || git fetch --tags || true

          # 1. Determine Channel
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ github.event.inputs.release_channel }}"
          else
            TAG_REF="${{ github.ref_name }}"
            if echo "$TAG_REF" | grep -iq "beta"; then
              CHANNEL="beta"
            else
              CHANNEL="stable"
            fi
          fi
          echo "Resolved Channel: $CHANNEL"
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV

          # 2. Determine Tag and Version
          EXPLICIT_TAG="${{ github.event.inputs.version_tag }}"
          if [ -n "$EXPLICIT_TAG" ]; then
            NEW_TAG="$EXPLICIT_TAG"
            NEW_VERSION="${NEW_TAG#v}"
            echo "Using explicit tag input: $NEW_TAG ($NEW_VERSION)"
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" =~ refs/tags/v ]]; then
            NEW_TAG="${{ github.ref_name }}"
            NEW_VERSION="${NEW_TAG#v}"
            echo "Using git push tag: $NEW_TAG ($NEW_VERSION)"
          else
            # Auto-increment based on channel
            LATEST_STABLE_TAG=$(git tag -l 'v*' | grep -v -i 'beta' | grep -v -i 'alpha' | sort -V | tail -n 1)
            if [ -z "$LATEST_STABLE_TAG" ]; then
              LATEST_STABLE_TAG="v1.0.0"
            fi
            CLEAN_STABLE=${LATEST_STABLE_TAG#v}
            IFS='.' read -r S_MAJOR S_MINOR S_PATCH <<< "$CLEAN_STABLE"
            S_MAJOR=${S_MAJOR:-1}
            S_MINOR=${S_MINOR:-0}
            S_PATCH=${S_PATCH:-0}

            if [ "$CHANNEL" = "beta" ]; then
              TARGET_BASE="$S_MAJOR.$S_MINOR.$((S_PATCH + 1))"
              LATEST_BETA_TAG=$(git tag -l "v${TARGET_BASE}-beta*" | sort -V | tail -n 1)
              if [ -n "$LATEST_BETA_TAG" ]; then
                BETA_NUM=$(echo "$LATEST_BETA_TAG" | grep -o -E '[0-9]+$' || echo "1")
                NEXT_BETA=$((BETA_NUM + 1))
                NEW_VERSION="${TARGET_BASE}-beta.${NEXT_BETA}"
              else
                NEW_VERSION="${TARGET_BASE}-beta.1"
              fi
              NEW_TAG="v$NEW_VERSION"
              echo "Auto-incremented Beta Version: $NEW_VERSION ($NEW_TAG)"
            else
              NEXT_PATCH=$((S_PATCH + 1))
              NEW_VERSION="$S_MAJOR.$S_MINOR.$NEXT_PATCH"
              NEW_TAG="v$NEW_VERSION"
              echo "Auto-incremented Stable Version: $NEW_VERSION ($NEW_TAG)"
            fi
          fi

          # 3. Calculate 32-bit positive versionCode
          BASE_NUMS=$(echo "$NEW_VERSION" | cut -d'-' -f1)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_NUMS"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          if [ "$CHANNEL" = "beta" ]; then
            BETA_REV=$(echo "$NEW_VERSION" | grep -o -E '[0-9]+$' || echo "1")
            NEW_CODE=$(( MAJOR * 100000 + MINOR * 1000 + PATCH * 10 + BETA_REV ))
            IS_PRERELEASE="true"
            DEFAULT_TITLE="Ctecs Beta $NEW_VERSION"
          else
            NEW_CODE=$(( MAJOR * 100000 + MINOR * 1000 + PATCH * 10 ))
            IS_PRERELEASE="false"
            DEFAULT_TITLE="Ctecs Release $NEW_VERSION"
          fi

          if [ -z "$NEW_CODE" ] || [ "$NEW_CODE" -le 0 ]; then
            NEW_CODE=1
          fi

          CUSTOM_TITLE="${{ github.event.inputs.release_title }}"
          if [ -n "$CUSTOM_TITLE" ]; then
            FINAL_TITLE="$CUSTOM_TITLE"
          else
            FINAL_TITLE="$DEFAULT_TITLE"
          fi

          echo "Final VersionName: $NEW_VERSION"
          echo "Final VersionCode: $NEW_CODE"
          echo "Final TagName: $NEW_TAG"
          echo "Final Title: $FINAL_TITLE"
          echo "Is Prerelease: $IS_PRERELEASE"

          if [ -f "app/build.gradle.kts" ]; then
            sed -i "s/versionCode = [0-9]\+/versionCode = $NEW_CODE/g" app/build.gradle.kts
            sed -i "s/versionName = \"[^\"]*\"/versionName = \"$NEW_VERSION\"/g" app/build.gradle.kts
          else
            echo "ERROR: app/build.gradle.kts not found!"
            exit 1
          fi

          echo "Verifying build.gradle.kts changes:"
          grep -E "versionCode|versionName" app/build.gradle.kts

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "NEW_CODE=$NEW_CODE" >> $GITHUB_ENV
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$FINAL_TITLE" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'ctecs123456' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ctecs123456' }}
          BUILD_CHANNEL: ${{ env.CHANNEL }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleRelease :app:bundleRelease -PbuildChannel=${{ env.CHANNEL }} --no-daemon
          else
            gradle :app:assembleRelease :app:bundleRelease -PbuildChannel=${{ env.CHANNEL }} --no-daemon
          fi

      - name: Locate and Package Artifacts
        id: artifacts
        run: |
          mkdir -p release_artifacts

          TAG_NAME="${{ env.NEW_TAG }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v1.0.1"
          fi

          # Find APK
          APK_PATH=$(find app/build -name "*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build -name "*.apk" | head -n 1)
          fi

          # Find AAB
          AAB_PATH=$(find app/build -name "*release*.aab" | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            AAB_PATH=$(find app/build -name "*.aab" | head -n 1)
          fi

          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "release_artifacts/Ctecs-${TAG_NAME}.apk"
            echo "apk_path=release_artifacts/Ctecs-${TAG_NAME}.apk" >> $GITHUB_OUTPUT
            echo "Packaged APK: release_artifacts/Ctecs-${TAG_NAME}.apk"
          fi

          if [ -f "$AAB_PATH" ]; then
            cp "$AAB_PATH" "release_artifacts/Ctecs-${TAG_NAME}.aab"
            echo "aab_path=release_artifacts/Ctecs-${TAG_NAME}.aab" >> $GITHUB_OUTPUT
            echo "Packaged AAB: release_artifacts/Ctecs-${TAG_NAME}.aab"
          fi

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Ctecs-Release-Binaries
          path: release_artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: ${{ env.RELEASE_TITLE }}
          tag_name: ${{ env.NEW_TAG }}
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          files: |
            release_artifacts/*.apk
            release_artifacts/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
